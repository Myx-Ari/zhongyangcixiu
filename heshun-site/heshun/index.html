  <article class="heritage-copy"><h1>和顺牵绣（晋绣）</h1><p>和顺牵绣（晋绣）是北方独有的硬质绣，区别于南方软缎刺绣，以多层土布裱糊制成袼褙硬底，刺绣时每一针丝线用力牵紧，因此得名“牵绣”。</p><p>核心特色技艺为层叠立体堆骨绣，又称刺绣里的浮雕技艺。色彩承袭三晋民间五行配色，纹样多用醒狮、龙虎、牡丹等吉祥符号。</p></article>
  <div class="work-choices"><button data-work="0"><img src="../assets/heshun/作品1.png" alt="醒狮刺绣作品"></button><button data-work="1"><img src="../assets/heshun/作品2.png" alt="和谐中国刺绣作品"></button></div>
  <aside class="lineage"><h2>和顺牵绣制作<br>技艺传承谱系</h2><p>第一代　王保妮<br>第二代　王根婵<br>第三代　郭槐梅<br>第四代　范素萍<br>第五代　张丽娜<br>　　　　张丽旭<br>　　　　张　慧<br>　　　　张慧超</p></aside>
